<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Svelte App</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="text-scale" content="scale" />

        <meta name="application-name" content="Svelte App" />
        <meta name="apple-mobile-web-app-title" content="Svelte App" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="mobile-web-app-capable" content="yes" />

        <meta name="theme-color" content="#fafafa" id="theme-color-meta" />
        <link rel="icon" type="image/png" href="/favicon.png" />
        <link
            rel="preload"
            href="/assets/fonts/google-sans-flex/google-sans-flex-var.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <style>
            @font-face {
                src: url("/assets/fonts/google-sans-flex/google-sans-flex-var.woff2")
                    format("woff2");
                unicode-range:
                    U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304,
                    U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
                    U+FEFF, U+FFFD;
                font-family: "Google Sans Flex";
                font-stretch: 100%;
                font-style: normal;
                font-weight: 100 900;
                font-display: swap;
            }
            @font-face {
                src: url("/assets/fonts/google-sans-code/google-sans-code-var.woff2")
                    format("woff2");
                unicode-range:
                    U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304,
                    U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
                    U+FEFF, U+FFFD;
                font-family: "Google Sans Code";
                font-style: normal;
                font-weight: 300 800;
                font-display: swap;
            }

            /* Inline FOUC protection: set basic app background immediately */
            :root {
                --color-base-50: oklch(98.5% 0 0);
                --color-base-950: oklch(14.1% 0.005 285.823);
                --color-app: var(--color-base-50);
            }
            .dark {
                --color-app: var(--color-base-950);
            }
            body {
                background-color: var(--color-app);
            }

            #app-loading {
                position: fixed;
                inset: 0;
                z-index: 9999;
                width: 100%;
                height: 100dvh;
                opacity: 0;
                pointer-events: none;
                transition:
                    opacity 350ms cubic-bezier(0.16, 1, 0.3, 1),
                    transform 350ms cubic-bezier(0.16, 1, 0.3, 1);

                &.visible {
                    opacity: 1;
                    pointer-events: auto;
                }

                &.fade-out {
                    opacity: 0;
                    transform: scale(0.98);
                    pointer-events: none;
                }
            }
        </style>

        <script>
            // Immediately detect and apply user preferences before browser paints
            (function () {
                try {
                    function initPreference(key, activeVal, inactiveVal, query, className) {
                        const saved = localStorage.getItem(key);
                        const systemMatches = window.matchMedia(query).matches;
                        const isActive =
                            saved === activeVal || (saved !== inactiveVal && systemMatches);

                        if (isActive) {
                            document.documentElement.classList.add(className);
                        } else {
                            document.documentElement.classList.remove(className);
                        }
                        return isActive;
                    }

                    // --- 1. THEME PREFERENCE ---
                    const isDark = initPreference(
                        // prettier-ignore
                        "ui-theme",
                        "dark",
                        "light",
                        "(prefers-color-scheme: dark)",
                        "dark"
                    );

                    document.documentElement.style.colorScheme = isDark ? "dark" : "light";

                    // Dynamically extract the background color from CSS variables to set the meta theme-color
                    const themeColor = getComputedStyle(document.documentElement)
                        .getPropertyValue("--color-app")
                        .trim();
                    const meta = document.getElementById("theme-color-meta");
                    if (meta && themeColor) {
                        meta.setAttribute("content", themeColor);
                    }

                    // --- 2. MOTION PREFERENCE ---
                    initPreference(
                        "ui-motion-preference",
                        "reduce",
                        "no-preference",
                        "(prefers-reduced-motion: reduce)",
                        "ui-reduce-motion"
                    );
                } catch (error) {
                    console.warn("UI preference initialization failed:", error);
                }
            })();
        </script>

        %unocss-svelte-scoped.global%
    </head>
    <body class="preload">
        <canvas id="app-loading" aria-hidden="true" aria-label="Loading"></canvas>
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>

    <script id="app-loading-script">
        (function () {
            const canvas = document.getElementById("app-loading");
            if (!canvas) return;

            const ctx = canvas.getContext("2d");
            let animId = null;

            const resize = () => {
                const dpr = window.devicePixelRatio || 1;
                const clientWidth = canvas.clientWidth || window.innerWidth;
                const clientHeight = canvas.clientHeight || window.innerHeight;
                canvas.width = clientWidth * dpr;
                canvas.height = clientHeight * dpr;
            };
            resize();
            window.addEventListener("resize", resize);

            const startTime = performance.now();
            window.__appLoadingStartTime = startTime;
            window.__appLoadingShowTimer = setTimeout(() => {
                canvas.classList.add("visible");
            }, 200);

            const getSmoothPerimeterPoint = (d, w, h, pad, r) => {
                const rx = w - 2 * pad;
                const ry = h - 2 * pad;
                const arcLen = 0.5 * Math.PI * r;
                const topSeg = rx - 2 * r;
                const rightSeg = ry - 2 * r;
                const botSeg = topSeg;
                const leftSeg = rightSeg;

                const totalP = 2 * topSeg + 2 * rightSeg + 4 * arcLen;
                let dist = ((d % totalP) + totalP) % totalP;

                if (dist < topSeg) return [pad + r + dist, pad];
                dist -= topSeg;

                if (dist < arcLen) {
                    const a1 = -Math.PI / 2 + (dist / arcLen) * (Math.PI / 2);
                    return [pad + rx - r + Math.cos(a1) * r, pad + r + Math.sin(a1) * r];
                }
                dist -= arcLen;

                if (dist < rightSeg) return [pad + rx, pad + r + dist];
                dist -= rightSeg;

                if (dist < arcLen) {
                    const a2 = (dist / arcLen) * (Math.PI / 2);
                    return [pad + rx - r + Math.cos(a2) * r, pad + ry - r + Math.sin(a2) * r];
                }
                dist -= arcLen;

                if (dist < botSeg) return [pad + rx - r - dist, pad + ry];
                dist -= botSeg;

                if (dist < arcLen) {
                    const a3 = Math.PI / 2 + (dist / arcLen) * (Math.PI / 2);
                    return [pad + r + Math.cos(a3) * r, pad + ry - r + Math.sin(a3) * r];
                }
                dist -= arcLen;

                if (dist < leftSeg) return [pad, pad + ry - r - dist];
                dist -= leftSeg;

                const a4 = Math.PI + (dist / arcLen) * (Math.PI / 2);
                return [pad + r + Math.cos(a4) * r, pad + r + Math.sin(a4) * r];
            };

            const render = (now) => {
                if (!canvas.isConnected) {
                    if (animId) cancelAnimationFrame(animId);
                    window.removeEventListener("resize", resize);
                    return;
                }

                const isDark = document.documentElement.classList.contains("dark");
                const dpr = window.devicePixelRatio || 1;
                const w = canvas.width;
                const h = canvas.height;
                const cx = w / 2;
                const cy = h / 2;

                const bg =
                    getComputedStyle(document.documentElement)
                        .getPropertyValue("--color-app")
                        .trim() || (isDark ? "oklch(14.1% 0.005 285.823)" : "oklch(98.5% 0 0)");
                const accentRgb = isDark ? [96, 165, 250] : [37, 99, 235];
                const textCol = isDark ? "rgba(226, 232, 240, " : "rgba(30, 41, 59, ";

                ctx.fillStyle = bg;
                ctx.fillRect(0, 0, w, h);

                const elapsed = (now - startTime) / 1000;
                const pad = 12 * dpr;
                const cornerR = 20 * dpr;
                const rx = w - 2 * pad;
                const ry = h - 2 * pad;
                const topSeg = rx - 2 * cornerR;
                const rightSeg = ry - 2 * cornerR;
                const arcLen = 0.5 * Math.PI * cornerR;
                const totalPerimeter = 2 * topSeg + 2 * rightSeg + 4 * arcLen;

                const speed = totalPerimeter * 0.22;
                const headDist = (elapsed * speed) % totalPerimeter;
                const tailLength = totalPerimeter * 0.13;
                const segments = 60;
                const strokeWidth = 3.5 * dpr;

                ctx.save();
                ctx.lineWidth = strokeWidth;
                ctx.lineCap = "round";
                ctx.lineJoin = "round";
                ctx.shadowColor = `rgba(${accentRgb.join(",")}, 0.65)`;
                ctx.shadowBlur = 14 * dpr;

                for (let i = 0; i < segments; i++) {
                    const frac1 = i / segments;
                    const frac2 = (i + 1) / segments;

                    const d1 = headDist - tailLength * (1 - frac1);
                    const d2 = headDist - tailLength * (1 - frac2);

                    const pt1 = getSmoothPerimeterPoint(d1, w, h, pad, cornerR);
                    const pt2 = getSmoothPerimeterPoint(d2, w, h, pad, cornerR);

                    const alpha = Math.pow(frac2, 1.8) * (isDark ? 0.95 : 0.85);
                    ctx.strokeStyle = `rgba(${accentRgb.join(",")}, ${alpha})`;

                    ctx.beginPath();
                    ctx.moveTo(pt1[0], pt1[1]);
                    ctx.lineTo(pt2[0], pt2[1]);
                    ctx.stroke();
                }
                ctx.restore();

                const textAlpha = 0.4 + (Math.sin(elapsed * 2.8) + 1) * 0.275;
                ctx.save();
                ctx.font = `600 ${Math.round(13.5 * dpr)}px "Google Sans Flex", system-ui, sans-serif`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillStyle = `${textCol}${textAlpha})`;
                ctx.shadowColor = `rgba(${accentRgb.join(",")}, 0.35)`;
                ctx.shadowBlur = 10 * dpr;
                ctx.fillText("LOADING", cx, cy);
                ctx.restore();

                animId = requestAnimationFrame(render);
            };

            animId = requestAnimationFrame(render);
        })();
    </script>
</html>
