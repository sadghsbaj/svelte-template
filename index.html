<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Svelte App</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="text-scale" content="scale" />

        <meta name="application-name" content="Svelte App" />
        <meta name="apple-mobile-web-app-title" content="Svelte App" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="mobile-web-app-capable" content="yes" />

        <meta name="theme-color" content="#fafafa" id="theme-color-meta" />
        <link rel="icon" type="image/png" href="/favicon.png" />
        <link
            rel="preload"
            href="/assets/fonts/google-sans-flex/google-sans-flex-var.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <style>
            @font-face {
                src: url("/assets/fonts/google-sans-flex/google-sans-flex-var.woff2")
                    format("woff2");
                unicode-range:
                    U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304,
                    U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
                    U+FEFF, U+FFFD;
                font-family: "Google Sans Flex";
                font-stretch: 100%;
                font-style: normal;
                font-weight: 100 900;
                font-display: swap;
            }
            @font-face {
                src: url("/assets/fonts/google-sans-code/google-sans-code-var.woff2")
                    format("woff2");
                unicode-range:
                    U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304,
                    U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
                    U+FEFF, U+FFFD;
                font-family: "Google Sans Code";
                font-style: normal;
                font-weight: 300 800;
                font-display: swap;
            }

            /* Inline FOUC protection: set basic app background immediately */
            :root {
                --color-base-50: oklch(98.5% 0 0);
                --color-base-950: oklch(14.1% 0.005 285.823);
                --color-app: var(--color-base-50);
            }
            .dark {
                --color-app: var(--color-base-950);
            }
            body {
                background-color: var(--color-app);
            }
        </style>

        <script>
            // Immediately detect and apply user preferences before browser paints
            (function () {
                try {
                    function initPreference(key, activeVal, inactiveVal, query, className) {
                        const saved = localStorage.getItem(key);
                        const systemMatches = window.matchMedia(query).matches;
                        const isActive =
                            saved === activeVal || (saved !== inactiveVal && systemMatches);

                        if (isActive) {
                            document.documentElement.classList.add(className);
                        } else {
                            document.documentElement.classList.remove(className);
                        }
                        return isActive;
                    }

                    // --- 1. THEME PREFERENCE ---
                    const isDark = initPreference(
                        // prettier-ignore
                        "ui-theme",
                        "dark",
                        "light",
                        "(prefers-color-scheme: dark)",
                        "dark"
                    );

                    document.documentElement.style.colorScheme = isDark ? "dark" : "light";

                    // Dynamically extract the background color from CSS variables to set the meta theme-color
                    const themeColor = getComputedStyle(document.documentElement)
                        .getPropertyValue("--color-app")
                        .trim();
                    const meta = document.getElementById("theme-color-meta");
                    if (meta && themeColor) {
                        meta.setAttribute("content", themeColor);
                    }

                    // --- 2. MOTION PREFERENCE ---
                    initPreference(
                        "ui-motion-preference",
                        "reduce",
                        "no-preference",
                        "(prefers-reduced-motion: reduce)",
                        "ui-reduce-motion"
                    );
                } catch (error) {
                    console.warn("UI preference initialization failed:", error);
                }
            })();
        </script>

        %unocss-svelte-scoped.global%
    </head>
    <body class="preload">
        <div id="app-mount"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
